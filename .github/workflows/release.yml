name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build, release & publish
    runs-on: ubuntu-latest
    environment: release
    # Secrets are read at the job level so steps can check their presence:
    # the Marketplace publish is skipped until PUBLISH_TOKEN is configured
    # (the very first Marketplace upload has to be done manually anyway).
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew check

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
          # Tags with a pre-release suffix (v0.1.0-alpha.1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish to JetBrains Marketplace
        if: env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
